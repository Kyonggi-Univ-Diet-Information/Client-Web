name: App CI

env:
  HUSKY: 0

on:
  push:
    branches:
      - main
    paths:
      - 'apps/land/**'
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/app-ci.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/land/**'
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/app-ci.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Pipelines:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: [lint, check-types, test, build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Create .env file for Next.js
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" >> apps/web/.env
          echo "NODE_ENV=production" >> apps/web/.env
          echo "OUTPUT_FILE_TRACING_ROOT=${{ github.workspace }}" >> apps/web/.env

      - name: Run commands
        run: pnpm ${{ matrix.command }}
